<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a3324">
  <title>Đăng nhập - Coffee Manager</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="login-form" novalidate>
      <div class="brand">
        <div class="cup">☕</div>
        <h1>Coffee Manager</h1>
        <div class="muted">Hệ thống quản lý quán cafe</div>
      </div>
      <div class="error hidden" id="login-error" role="alert"></div>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary btn-lg btn-block" id="login-btn" type="submit">Đăng nhập</button>
      <div class="demo-accounts">
        <b>Tài khoản dùng thử</b> (bấm để điền):<br>
        Quản trị: <code data-u="admin" data-p="admin123">admin / admin123</code><br>
        Quản lý: <code data-u="quanly" data-p="quanly123">quanly / quanly123</code><br>
        Thu ngân: <code data-u="thungan1" data-p="123456">thungan1 / 123456</code><br>
        Pha chế: <code data-u="phache1" data-p="123456">phache1 / 123456</code>
      </div>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
