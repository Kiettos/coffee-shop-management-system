<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a3324">
  <title>Sản phẩm & công thức - Coffee Manager</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="page" class="hidden">
    <div class="card">
      <div class="card-head"><h2>Danh mục</h2><span class="muted small">Nhấp đúp vào danh mục để sửa / xóa</span><button class="btn-sm" id="btn-cat">➕ Thêm danh mục</button></div>
      <div class="chips" id="cats"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Thực đơn</h2>
        <input type="search" id="q" placeholder="🔍 Tìm món" style="width:200px">
        <label style="font-weight:400;display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="show-inactive" style="width:auto;min-height:auto"> Hiện món ngừng bán</label>
        <button class="btn-primary" id="btn-add">➕ Thêm món</button>
      </div>
      <div id="t-products"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
